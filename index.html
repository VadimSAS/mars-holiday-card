<script>
'use strict';
const get = id => document.getElementById(id);
const form = get('editor-form');
const products = get('products');
const scene = get('scene');
const recipient = JSON.parse(get('gift-data').textContent);
let gift = recipient;
let steps = [];
let step = 0;

function element(tag, text='', className='') {
  const node = document.createElement(tag);
  node.textContent = text;
  node.className = className;
  return node;
}
function control(text, action, className='') {
  const button = element('button',text,className);
  button.type = 'button';
  button.onclick = action;
  return button;
}
function numberProducts() {
  Array.from(products.children).forEach((card,index)=>card.querySelector('strong').textContent='Шарик '+(index+1));
}
function addProduct() {
  const card = get('product-template').content.firstElementChild.cloneNode(true);
  card.querySelector('.remove').onclick = () => {card.remove();numberProducts();};
  products.append(card);
  numberProducts();
  return card;
}
function webUrl(value) {
  if (!value) return '';
  const url = new URL(value);
  if (!['http:','https:'].includes(url.protocol)) throw Error('Для ссылок используйте адреса http или https.');
  return url.href;
}
function readPhoto(file) {
  return new Promise((resolve,reject)=>{
    if (!/^image\/(jpeg|png|webp|gif|avif)$/.test(file.type)) {
      reject(Error('Загрузите JPG, PNG, WebP, GIF или AVIF.'));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(Error('Не удалось прочитать фото.'));
    reader.readAsDataURL(file);
  });
}
async function readGift() {
  const data = new FormData(form);
  const value = key => String(data.get(key)||'').trim();
  if (!value('to') || !value('from')) throw Error('Введите имена получателя и отправителя.');
  const items = [];
  for (const card of products.children) {
    const field = key => card.querySelector('[data-field="'+key+'"]');
    const name = field('name').value.trim();
    const description = field('description').value.trim();
    const photo = field('photo').value.trim();
    const link = field('link').value.trim();
    const file = field('file').files[0];
    if (!name && !description && !photo && !link && !file) continue;
    if (!name) throw Error('Добавьте название товара в поле «'+card.querySelector('strong').textContent+'».');
    items.push({name,description,photo:file ? await readPhoto(file) : webUrl(photo),link:webUrl(link)});
  }
  const wishes = ['Больше времени для близких','Добрых новостей в новом году','Дней, которые хочется запомнить','Тёплых и радостных встреч'];
  return {to:value('to'),from:value('from'),relation:value('relation'),secret:data.has('secret'),items,
    opening:value('opening')||'Пусть эти праздники будут тёплыми.',
    wishes:wishes.map((wish,index)=>value('wish'+(index+1))||wish),
    letter:value('letter')||'Пусть в новом году будет больше поводов встретиться, посмеяться и порадовать друг друга. С праздником!'};
}
function photo(src,alt,fallback='') {
  const img = element('img');
  img.alt = alt;
  img.onerror = () => img.replaceWith(element('span',fallback));
  img.src = src;
  return img;
}
function globe(item, reveal) {
  const ball = control('',()=>{
    ball.classList.remove('shake');
    void ball.offsetWidth;
    ball.classList.add('shake');
    reveal?.();
  },'globe');
  ball.setAttribute('aria-label','Встряхнуть снежный шар');
  const glass = element('span','','glass');
  glass.append(item ? photo(item.photo,item.name,'❄') : element('span','❄'));
  for (let index=0;index<36;index++) {
    const flake = element('span',index%3 ? '•' : '✦','flake');
    flake.setAttribute('aria-hidden','true');
    flake.style.setProperty('--x',(index*43%100)+'%');
    flake.style.setProperty('--y',(index*37%100)+'%');
    flake.style.setProperty('--speed',(3+index%5)+'s');
    flake.style.setProperty('--delay',-(index%7)+'s');
    flake.style.setProperty('--size',(9+index%9)+'px');
    glass.append(flake);
  }
  let start = null;
  ball.onpointerdown = event => {start=event.clientX;};
  ball.onpointermove = event => {
    if (start!==null && Math.abs(event.clientX-start)>20) {start=null;ball.click();}
  };
  ball.onpointerup = ball.onpointerleave = ball.onpointercancel = () => {start=null;};
  ball.append(glass);
  return ball;
}
function heading(label,title) {scene.append(element('p',label,'eyebrow'),element('h2',title));}
const renderedSteps=new Map();
function goToStep(target){
  if(target<0||target>=steps.length||target===step||document.querySelector('dialog[open]'))return;
  step=target;
  render();
}
function next(text='Дальше') {return control(text,()=>goToStep(step+1),'primary');}


function softSnowFlake(color){
  const sprite=element('canvas');
  sprite.width=sprite.height=24;
  const ctx=sprite.getContext('2d');
  const glow=ctx.createRadialGradient(12,12,1,12,12,11);
  glow.addColorStop(0,color);
  glow.addColorStop(.43,color);
  glow.addColorStop(1,'transparent');
  ctx.translate(12,12);
  ctx.scale(.72,1);
  ctx.translate(-12,-12);
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,24,24);
  return sprite;
}
function giftSnowEffect(box){
  const canvas=element('canvas','','gift-snow');
  canvas.setAttribute('aria-hidden','true');
  const ctx=canvas.getContext('2d');
  const sprite=softSnowFlake('#fffcf6');
  const tuft=new Image();
  tuft.src="assets/gift-snow-tuft.png";
  const shadow=softSnowFlake('#775f4c');
  let frame=0;
  function stop(){
    cancelAnimationFrame(frame);frame=0;
    ctx.clearRect(-1,-1,3,3);
  }
  function play(){
    stop();
    const width=canvas.clientWidth,height=canvas.clientHeight;
    if(!width||!height)return;
    const dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(width*dpr);
    canvas.height=Math.round(height*dpr);
    const unitX=canvas.width/1.44,unitY=canvas.height/1.15;
    const boxWidth=box.clientWidth;
    ctx.setTransform(unitX,0,0,unitY,.22*unitX,.11*unitY);
    const flakes=Array.from({length:266},(_,index)=>{
      const lid=Math.random()<.36;
      const direction=Math.random()<.5?-1:1;
      const x=lid?.095+Math.random()*.79:direction<0?-.063+Math.random()*.123:.944+Math.random()*.124;
      const end=lid?.143+Math.random()*.027:.85+Math.pow(Math.random(),.75)*.17;
      const first=index<92;
      return {lid,x,end,startY:first?-.085+Math.random()*(lid?.14:.46):-.09,
        phase:Math.random()*Math.PI*2,turn:(Math.random()-.5)*.95,flutter:4.8+Math.random()*5,delay:first?Math.random()*.38:.45+Math.random()*9.3,
        duration:lid?.75+Math.random()*1.7:2.35+Math.random()*3.25,
        radius:1.1+Math.random()*1.34,opacity:.75+Math.random()*.25,drift:.008+Math.random()*.024};
    });
    const started=performance.now();
    const draw=now=>{
      ctx.clearRect(-1,-1,3,3);
      if(!canvas.isConnected||box.getAttribute('aria-expanded')!=='true'){frame=0;return;}
      const time=(now-started)/1000;
      let moving=false;
      for(const flake of flakes){
        const t=(time-flake.delay)/flake.duration;
        if(t<1)moving=true;
        if(t<0)continue;
        const phase=Math.min(1,t);
        const y=flake.startY+(flake.end-flake.startY)*phase;
        const sway=(Math.sin(flake.phase+phase*flake.flutter)+.35*Math.sin(phase*17+flake.phase*.7))*flake.drift;
        let x=flake.x+sway;
        if(!flake.lid&&y>.15&&y<.85)x=flake.x<.5?Math.min(x,.062):Math.max(x,.93);
        if(flake.lid)x=Math.max(.09,Math.min(.894,x));
        const alpha=flake.opacity*Math.min(1,phase*20)*(phase===1?.79:1);
        const r=flake.radius/boxWidth;
        const height=r*(phase===1?1.06:1.72);
        ctx.globalAlpha=alpha*.4;
        ctx.drawImage(shadow,x-r*1.13,y-r*.46,r*2.26,height*1.13);
        ctx.globalAlpha=alpha;
        if(tuft.complete&&tuft.naturalWidth){
          ctx.save();
          ctx.translate(x,y);
          ctx.rotate(phase===1?flake.turn*.2:flake.turn+Math.sin(phase*12+flake.phase)*.33);
          ctx.drawImage(tuft,76,330,1075,530,-r*1.25,-height*.52,r*2.5,height*(phase===1?.70:1.1));
          ctx.restore();
        }else{
          ctx.drawImage(sprite,x-r,y-r*.63,r*2,height);
        }
      }
      ctx.globalAlpha=1;
      if(moving)frame=requestAnimationFrame(draw);
      else frame=0;
    };
    frame=requestAnimationFrame(draw);
  }
  return {canvas,play,stop};
}

function photoSnowEffect(art,motionEnabled){
  const canvas=element('canvas','','photo-snow');
  canvas.setAttribute('aria-hidden','true');
  const context=canvas.getContext('2d');
  const samples=[[1053,588],[1066,588],[1092,588],[1105,588],[1118,588],[1131,588],[1157,588],[1183,588],[1196,588],[1248,588],[1261,588],[936,595],[949,595],[962,595],[975,595],[1001,595],[1027,595],[1040,595],[1053,595],[1066,595],[1079,595],[1092,595],[1105,595],[1118,595],[1131,595],[1144,595],[1196,595],[1222,595],[1235,595],[1248,595],[1261,595],[1274,595],[1287,595],[923,602],[936,602],[949,602],[975,602],[1001,602],[1014,602],[1040,602],[1053,602],[1066,602],[1105,602],[1131,602],[1144,602],[1157,602],[1170,602],[1183,602],[1209,602],[1222,602],[1235,602],[1248,602],[1261,602],[1274,602],[1287,602],[1300,602],[1339,602],[910,609],[923,609],[936,609],[949,609],[962,609],[975,609],[988,609],[1001,609],[1014,609],[1066,609],[1079,609],[1092,609],[1118,609],[1131,609],[1144,609],[1157,609],[1183,609],[1196,609],[1209,609],[1222,609],[1235,609],[1248,609],[1261,609],[1300,609],[923,616],[936,616],[949,616],[962,616],[975,616],[988,616],[1001,616],[1014,616],[1027,616],[1040,616],[1053,616],[1066,616],[1079,616],[1092,616],[1105,616],[1118,616],[1131,616],[1144,616],[1170,616],[1183,616],[1196,616],[1235,616],[1248,616],[1261,616],[1274,616],[1287,616],[923,623],[936,623],[949,623],[962,623],[975,623],[988,623],[1001,623],[1014,623],[1027,623],[1040,623],[1053,623],[1079,623],[1092,623],[1105,623],[1131,623],[1144,623],[1157,623],[1170,623],[1183,623],[1196,623],[962,630],[1001,630],[1066,630],[1131,630],[1144,630],[1183,630],[1196,630],[1209,630],[1222,630],[910,637],[1209,637]];
  const waves=[
    {share:.40,delay:0,duration:5.8,lift:.27,cross:.14},
    {share:.275,delay:.08,duration:6.25,lift:.24,cross:-.18},
    {share:.325,delay:.17,duration:6.8,lift:.21,cross:.12}
  ];
  let frame=0, burst=0;
  function play(){
    const size=canvas.clientWidth;
    if(!context||!motionEnabled()||!size||!art.complete||!art.naturalWidth)return;
    cancelAnimationFrame(frame);
    const scale=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(size*scale);
    canvas.height=canvas.width;
    context.setTransform(canvas.width,0,0,canvas.height,0,0);
    let seed=29319+burst++*113;
    const random=()=>{
      seed=(Math.imul(seed,1664525)+1013904223)>>>0;
      return seed/4294967296;
    };
    const sampleCanvas=element('canvas');
    sampleCanvas.width=art.naturalWidth;
    sampleCanvas.height=art.naturalHeight;
    const sampleContext=sampleCanvas.getContext('2d',{willReadFrequently:true});
    sampleContext.drawImage(art,0,0);
    const sprites=samples.map(([sx,sy])=>{
      const [red,green,blue]=sampleContext.getImageData(sx,sy,1,1).data;
      return softSnowFlake('rgb('+[red,green,blue].map(c=>Math.round(160+c*.37)).join(',')+')');
    });
    const particles=waves.flatMap((wave,waveIndex)=>{
      const length=waveIndex===2?467-Math.round(467*.40)-Math.round(467*.275):Math.round(467*wave.share);
      return Array.from({length},()=>{
        const sampleIndex=Math.floor(random()*samples.length);
        const sample=samples[sampleIndex];
        const x=-.806+sample[0]/1536*1.81;
        const baseline=-.055+sample[1]/1536*1.81;
        const phase=random()*Math.PI*2;
        return {sprite:sprites[sampleIndex],x,baseline,phase,
          spread:(random()-.5)*.48+wave.cross,
          lift:wave.lift*(.42+random()*.95),
          delay:wave.delay+random()*.22,
          duration:wave.duration*(.81+random()*.21),
          peak:.28+random()*.17,
          radius:(.48+random()*.91)/size,
          drift:.006+random()*.013};
      });
    });
    const started=performance.now();
    const draw=now=>{
      context.clearRect(0,0,1,1);
      if(!canvas.isConnected||!motionEnabled()){frame=0;return;}
      const elapsed=(now-started)/1000;
      context.save();
      context.beginPath();
      context.ellipse(.500,.357,.378,.335,0,0,Math.PI*2);
      context.clip();
      let moving=false;
      for(const p of particles){
        const progress=(elapsed-p.delay)/p.duration;
        if(progress>=1)continue;
        moving=true;
        if(progress<0)continue;
        const rising=progress<p.peak;
        const t=rising?progress/p.peak:(progress-p.peak)/(1-p.peak);
        const travel=rising?Math.sin(t*Math.PI/2):Math.cos(t*Math.PI/2);
        const wave=Math.sin(elapsed*(1.55+p.drift*22)+p.phase);
        const x=p.x+p.spread*travel*(.7+.3*wave)+wave*p.drift*travel;
        const y=p.baseline-p.lift*travel+Math.cos(elapsed*2.2+p.phase)*p.drift*.35*travel;
        const radius=p.radius*(.74+.45*travel);
        context.globalAlpha=Math.min(1,progress*16,(1-progress)*8)*(.59+.32*travel);
        context.drawImage(p.sprite,x-radius,y-radius,radius*2,radius*2);
      }
      context.restore();
      if(moving)frame=requestAnimationFrame(draw);
      else frame=0;
    };
    frame=requestAnimationFrame(draw);
  }
  return {canvas,play};
}

function cathedralGlobe(reveal) {
  const ball = control('', null, 'globe cathedral stars');
  ball.setAttribute('aria-label','Встряхнуть снежный шар с храмом Василия Блаженного');
  const photograph=element('span','','cover-photograph');
  photograph.setAttribute('aria-hidden','true');
  const art=element('img','','cover-photograph-image');
  art.src='assets/8e0a78ae1672738d.png';
  art.alt='';
  art.draggable=false;
  photograph.append(art);
  const snow = element('span','','cathedral-snow');
  snow.setAttribute('aria-hidden','true');
  for (let index = 0; index < 24; index++) {
    const flake = element('i');
    flake.style.setProperty('--x',index * 43 % 100 + '%');
    flake.style.setProperty('--y',index * 67 % 56 + '%');
    flake.style.setProperty('--size',2 + index % 4 + 'px');
    flake.style.setProperty('--delay',index % 10 * 22 + 'ms');
    flake.style.setProperty('--drift-angle',(index * 31 % 68 - 34) + 'deg');
    flake.style.setProperty('--drift',(index * 31 % 95 - 47) + 'px');
    snow.append(flake);
  }
  const reduced=matchMedia('(prefers-reduced-motion:reduce)');
  const motionEnabled=()=>!reduced.matches||ball.classList.contains('motion-requested');
  const photoSnow=photoSnowEffect(art,motionEnabled);
  ball.append(photograph,snow,photoSnow.canvas);
  let active=false, frame=0, x=0, y=0, targetX=0, targetY=0, last=0;
  const draw=time=>{
    if(!ball.isConnected||!motionEnabled()){
      frame=0;
      last=0;
      return;
    }
    const dt=last?Math.min(time-last,50):16;
    last=time;
    const blend=1-Math.exp(-dt/90);
    x+=(targetX-x)*blend;
    y+=(targetY-y)*blend;
    if(Math.abs(targetX-x)<.005)x=targetX;
    if(Math.abs(targetY-y)<.005)y=targetY;
    snow.style.setProperty('--decor-x',x.toFixed(3)+'px');
    snow.style.setProperty('--decor-y',y.toFixed(3)+'px');
    if(x!==targetX||y!==targetY)frame=requestAnimationFrame(draw);
    else{frame=0;last=0;}
  };
  ball.addEventListener('pointerenter',event=>{
    if(event.pointerType==='mouse')active=true;
  });
  window.addEventListener('mousemove',event=>{
    if(!active||!ball.isConnected||!motionEnabled())return;
    targetX=-Math.max(-1,Math.min(1,(event.clientX-innerWidth/2)/(innerWidth/2)))*1.5;
    targetY=-Math.max(-1,Math.min(1,(event.clientY-innerHeight/2)/(innerHeight/2)))*1.5;
    if(!frame)frame=requestAnimationFrame(draw);
  },{passive:true});

  ball.onclick = () => {
    ball.classList.remove('stir');
    void ball.offsetWidth;
    ball.classList.add('stir','motion-requested');
    photoSnow.play();
    reveal();
  };
  let start = null;
  ball.onpointerdown = event => {start=event.clientX;};
  ball.onpointermove = event => {
    if (start!==null && Math.abs(event.clientX-start)>18) {start=null;ball.click();}
  };
  ball.onpointerup = ball.onpointerleave = ball.onpointercancel = () => {start=null;};
  return ball;
}

function welcome() {
  const opening = element('div','','opening opening--center');
  const sender = element('p','Компания ','eyebrow');
  sender.append(element('span','MARS','mars-name'));
  sender.append(element('br'),'поздравляет');
  const copy = element('div','','opening-copy');
  const title = element('h2','Встряхните ');
  title.append(element('em','снежный шар'));
  const hint = element('p','Нажмите на шар или покачайте его.','hint');
  const proceed = next('Открыть поздравление');
  proceed.hidden = true;
  let revealed = false;
  const ball = cathedralGlobe(()=>{
    if (revealed) return;
    revealed = true;
    title.textContent = gift.to+'!';
    title.classList.add('revealed-greeting');
    hint.textContent = gift.opening;
    proceed.hidden = false;
  });
  copy.append(title,hint,proceed);
  opening.append(sender,ball,copy);
  scene.append(opening);
}


function surprise() {
  const layout=element('div','','box-layout');
  const title=element('h2','Откройте подарок');
  const hint=element('p','Нажмите на коробку, чтобы открыть.','box-hint');
  const proceed=next();
  proceed.hidden=true;
  const box=control('',()=>{
    const open=box.getAttribute('aria-expanded')==='false';
    box.setAttribute('aria-expanded',String(open));
    box.setAttribute('aria-label',open?'Закрыть коробку':'Открыть коробку');
    hint.textContent=open?'Нажмите ещё раз, чтобы закрыть.':'Нажмите на коробку, чтобы открыть.';
    proceed.hidden=!open;
    if(open)effect.play();else effect.stop();
  },'box-trigger');
  const effect=giftSnowEffect(box);
  box.setAttribute('aria-expanded','false');
  box.setAttribute('aria-label','Открыть коробку');
  for(const state of ['box-closed','box-open']){
    const crop=element('span','','box-frame '+state);
    const picture=element('img');
    picture.src="assets/43c4ac8978588a75.png";
    picture.alt='';
    picture.draggable=false;
    crop.setAttribute('aria-hidden','true');
    crop.append(picture);
    box.append(crop);
  }
  const boxScene=element('div','','gift-box-scene');
  boxScene.append(box,effect.canvas);
  layout.append(title,boxScene,hint,proceed);
  scene.append(layout);
}





function wishes(){
  const title=element('h2','Четыре ','wish-heading');
  title.append(element('em','пожелания'));
  const hint=element('p','Нажмите на печать, чтобы открыть конверт.','wish-instruction');
  const group=element('div','','cotton-grid');
  const read=new Set();
  const proceed=next();
  proceed.hidden=true;
  const source="assets/9587f31fc55bd5c1.png";
  gift.wishes.forEach((wish,index)=>{
    const number=index+1;
    const envelope=control('',()=>{
      const open=envelope.getAttribute('aria-expanded')==='false';
      envelope.setAttribute('aria-expanded',String(open));
      envelope.setAttribute('aria-label',open?'Закрыть пожелание '+number+': '+wish:'Открыть пожелание '+number);
      paper.setAttribute('aria-hidden',String(!open));
      if(open)read.add(index);
      proceed.hidden=step>=steps.length-1||read.size!==gift.wishes.length;
    },'cotton-wish');
    envelope.setAttribute('aria-expanded','false');
    envelope.setAttribute('aria-label','Открыть пожелание '+number);
    const paper=element('span','','cotton-letter');
    paper.setAttribute('aria-hidden','true');
    const message=element('span','','cotton-message');
    const lineBreaks=[
      ['Тепла и уюта','для вашего дома'],
      ['Мира, любви,','благополучия','и счастья'],
      ['Крепкого здоровья','и новых свершений'],
      ['Любви']
    ];
    const lines=lineBreaks[index];
    if(lines&&lines.join(' ')===wish)lines.forEach(line=>message.append(element('span',line,'cotton-line')));
    else message.textContent=wish;
    paper.append(message);
    const layer=className=>{
      const crop=element('span','','cotton-layer '+className);
      const image=element('img');
      image.src=source;
      image.alt='';
      image.draggable=false;
      crop.setAttribute('aria-hidden','true');
      crop.append(image);
      return crop;
    };
    envelope.append(layer('cotton-open-back'),paper,layer('cotton-open-front'),layer('cotton-open-seal'),layer('cotton-shut'));
    group.append(envelope);
  });
  scene.append(title,hint,group,proceed);
}
function openProduct(item) {
  const content = get('detail-content');
  content.replaceChildren();
  if (item.photo) content.append(photo(item.photo,item.name,'Фото недоступно'));
  content.append(element('h2',item.name),element('p',item.description));
  if (item.link) {
    const link = element('a','Открыть страницу товара');
    link.href = item.link;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    content.append(link);
  }
  get('detail').showModal();
}

function printGift() {
  const old = Array.from(scene.childNodes);
  scene.replaceChildren(element('h2','С праздником, '+gift.to+'!'),element('p','От '+gift.from),element('p',gift.opening));
  gift.wishes.forEach(wish=>scene.append(element('p',wish)));
  scene.append(element('article',gift.letter,'letter'));
  gift.items.forEach(item=>scene.append(element('h3',item.name),element('p',item.description)));
  try {window.print();} finally {scene.replaceChildren(...old);}
}

function saveGlobe() {
  const picture = new Image();
  picture.onload = () => {
    const canvas = element('canvas');
    canvas.width = 1000;
    canvas.height = 1120;
    const ctx = canvas.getContext('2d');
    const background = ctx.createLinearGradient(0,0,1000,1120);
    background.addColorStop(0,'#354f54');
    background.addColorStop(1,'#101f30');
    ctx.fillStyle = background;
    ctx.fillRect(0,0,1000,1120);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#edc98d';
    ctx.font = '28px Georgia';
    ctx.fillText('КОМПАНИЯ MARS',500,100);
    ctx.fillStyle = '#fff1dc';
    ctx.font = '56px Georgia';
    ctx.fillText('С наступающими праздниками!',500,195,900);
    ctx.fillStyle = '#a77a55';
    ctx.beginPath();
    ctx.roundRect(280,798,440,72,24);
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.arc(500,540,280,0,Math.PI*2);
    ctx.clip();
    ctx.fillStyle = '#24465b';
    ctx.fillRect(220,260,560,560);
    const scale = Math.max(520/picture.width,520/picture.height);
    const width = picture.width*scale;
    const height = picture.height*scale;
    ctx.drawImage(picture,500-width/2,540-height/2,width,height);
    const glass = ctx.createRadialGradient(400,400,24,500,540,285);
    glass.addColorStop(0,'#ffffff28');
    glass.addColorStop(.8,'#72bcd322');
    glass.addColorStop(1,'#d7f6ffba');
    ctx.fillStyle = glass;
    ctx.fillRect(220,260,560,560);
    ctx.fillStyle = '#fff9';
    for(let index=0;index<80;index++){
      ctx.beginPath();
      ctx.arc(220+index*83%560,260+index*97%560,2+index%4,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#fff1dc';
    ctx.font = '30px Georgia';
    ctx.fillText('Мира, здоровья и благополучия в новом году!',500,981,890);
    canvas.toBlob(blob=>{
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const link = element('a');
      link.href = url;
      link.download = 'Снежный шар — Mars.png';
      link.click();
      setTimeout(()=>URL.revokeObjectURL(url),30000);
    },'image/png');
  };
  picture.src=gift.board;
}

function finale() {

  card.src="assets/f3bf178cfdbb9a26.png";

  const picture=element('picture','','final-postcard-picture');
  const mobile=element('source');
  mobile.media='(orientation:portrait)';
  mobile.srcset="assets/mars-postcard-portrait.png";
  picture.append(mobile,card);
  const actions=element('div','','row final-postcard-actions');
  const download=control('Скачать открытку',()=>{
    const link=element('a');
    link.href=card.currentSrc||card.src;
    link.download=matchMedia(mobile.media).matches?'Финальная открытка Mars — для телефона.png':'Финальная открытка Mars — Гастрономическая доска.png';
    link.click();

  actions.append(download);
  scene.append(title,picture,actions);
}
function render() {
  document.body.classList.toggle('winter-cover',step===0);
  document.body.classList.toggle('box-stage',step===1);
  document.body.classList.toggle('wish-stage',steps[step]===wishes);
  document.body.classList.toggle('products-stage',steps[step]===baubles);
  document.body.classList.toggle('postcard-finale',steps[step]===finale);
  const saved=renderedSteps.get(step);
  scene.replaceChildren(...(saved||[]));
  if(!saved){
    steps[step]();
    renderedSteps.set(step,Array.from(scene.childNodes));
  }
  get('story-prev').disabled=step===0;
  get('story-next').disabled=step===steps.length-1;
  document.querySelector('.mars-corner-ornament').hidden=step===steps.length-1;
  get('back').hidden = step===0;
  get('progress').textContent = 'Глава '+(step+1)+' из '+steps.length;
  const title = scene.querySelector('h2');
  title.tabIndex = -1;
  title.focus({preventScroll:true});
  window.scrollTo(0,0);
}
function show() {
  steps = [welcome,surprise,...(gift.items.length?[baubles]:[]),wishes,finale];
  step=0;
  renderedSteps.clear();
  get('editor').hidden=true;
  get('stage').hidden=false;
  get('edit').hidden=Boolean(recipient);
  render();
}
function download() {
  const copy = document.documentElement.cloneNode(true);
  copy.querySelector('#gift-data').textContent = JSON.stringify(gift).replaceAll('<','\\u003c');
  copy.querySelector('#editor').replaceChildren();
  copy.querySelector('#scene').replaceChildren();
  const url = URL.createObjectURL(new Blob(['<!doctype html>\n',copy.outerHTML],{type:'text/html;charset=utf-8'}));
  const link = element('a');
  link.href = url;
  link.download = 'Снежный шар.html';
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
get('back').onclick = () => goToStep(step-1);
get('story-prev').onclick=()=>goToStep(step-1);
get('story-next').onclick=()=>goToStep(step+1);
document.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||get('stage').hidden||document.querySelector('dialog[open]'))return;
  if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
    event.preventDefault();
    goToStep(step+(event.key==='ArrowLeft'?-1:1));
  }
});
get('edit').onclick = () => {get('stage').hidden=true;get('editor').hidden=false;window.scrollTo(0,0);};
if (recipient) {
  show();
} else {
  addProduct();
  get('add').onclick = () => addProduct().querySelector('[data-field="name"]').focus();
  form.onsubmit = async event => {
    event.preventDefault();
    const buttons = Array.from(form.querySelectorAll('button[type="submit"]'));
    buttons.forEach(button=>button.disabled=true);
    get('status').textContent='';
    try {
      gift = await readGift();
      if (event.submitter?.id==='export') {download();get('status').textContent='Открытка скачана.';}
      else show();
    } catch (error) {
      get('status').textContent=error.message;
    } finally {
      buttons.forEach(button=>button.disabled=false);
    }
  };
}
